[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search"
dynamic = ["version", "license"]
description = 'Paper search tool'
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chenchao Zhao", email = "chenchao.zhao.dev+github@gmail.com" },
]
dependencies = [
    "defusedxml",
    "fire",
    "httpx",
    "loguru",
    "mcp>=1.0,<2",
    "tenacity",
    "tomli-w",
]

[project.scripts]
paper-search = "paper_search.cli:main"
paper-search-mcp = "paper_search.mcp_server:main"

[tool.hatch.version]
path = "src/paper_search/__about__.py"

[tool.hatch.envs.default]
type = "pip-compile"
python = "3.12"
path = ".venv"
dependencies = ["pytest", "mypy", "rumdl"]

[tool.hatch.envs.default.scripts]
typing = "mypy --install-types --non-interactive src/"
docfmt = "rumdl check --fix ."
test-integration = "pytest tests/integration/ -v --override-ini='addopts='"
release = ["hatch fmt", "typing", "hatch test --cover"]

[tool.rumdl]
extend-disable = ["MD013"]

[tool.ruff.lint]
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
"src/paper_search/cli.py" = ["T201"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search"]

[tool.hatch.envs.hatch-test]
features = []
